name: Web validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build Creator application
        run: npm run build

      - name: Build recipient Runtime
        run: npm run build:runtime

      - name: Check recipient bundle boundary
        run: npm run check:runtime-bundle

      - name: Test publish Worker
        run: npm run test:worker

      - name: Type-check publish Worker
        run: npm run typecheck:worker

      - name: Test deployment safety tooling
        run: npm run test:deployment

      - name: Validate deployment configuration structure
        run: npm run validate:deploy:config

      - name: Build publish Worker
        run: npm run build:worker
